services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abx
      POSTGRES_PASSWORD: abx_dev
      POSTGRES_DB: abx
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abx -d abx"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: on-failure

  init:
    image: node:22
    working_dir: /app
    volumes:
      - ./server:/app
    environment:
      DATABASE_URL: postgres://abx:abx_dev@db:5432/abx
    command: ["sh", "-ec", "npm install --omit=dev && node init.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: node:22
    working_dir: /app
    volumes:
      - ./server:/app
    environment:
      DATABASE_URL: postgres://abx:abx_dev@db:5432/abx
      PORT: "4000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install && exec npx nodemon index.js"]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "3000:5173"
    environment:
      API_PROXY_TARGET: http://api:4000
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ""
    command: ["sh", "-ec", "npm install && exec npx vite dev --host 0.0.0.0 --port 5173"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: on-failure

volumes:
  db_data:
